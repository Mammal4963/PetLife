<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetLife 🐾</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <script>
    // Apply a saved theme choice before the first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem('pl_theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="login-overlay" class="hidden">
    <form id="login-form" class="card login-card">
      <h1>🐾 PetLife</h1>
      <p>Enter the family password</p>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit" class="btn primary">Come on in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <header class="topbar">
    <a href="#/" class="brand">🐾 PetLife</a>
    <div class="topbar-right">
      <nav>
        <a href="#/" data-nav="home">Home</a>
        <a href="#/timeline" data-nav="timeline">Timeline</a>
        <a href="#/pets" data-nav="pets">Pets</a>
      </nav>
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="modal-root"></div>
  <div id="lightbox" class="hidden"><img alt=""></div>

  <script src="/js/compress.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
